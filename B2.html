  var by={};ITEMS.forEach(function(i){(by[i.disc]=by[i.disc]||{})[i.grp]=(by[i.disc][i.grp]||{n:0,t:i.gn||''});by[i.disc][i.grp].n++});
  var h='<button class="gp'+(fG?'':' on')+'" data-g=""><span class="g">ALL</span><span class="t">ทั้งหมด</span><span class="c">'+ITEMS.length+'</span></button>';
  Object.keys(by).sort().forEach(function(d){
    var c=(DISC[d]||['',''])[1]||'#64748B';
    h+='<div class="dh"><span class="dot" style="background:'+c+'"></span>'+d+' '+((DISC[d]||[''])[0]||'')+'</div>';
    Object.keys(by[d]).sort().forEach(function(g){var o=by[d][g];
      h+='<button class="gp'+(fG===g?' on':'')+'" data-g="'+g+'"><span class="g">'+g+'</span><span class="t">'+esc(o.t)+'</span><span class="c">'+o.n+'</span></button>'})});
  $('#tree').innerHTML=h;
  $$('#tree .gp').forEach(function(b){b.onclick=function(){fG=b.dataset.g;tree();render()}});
}
function render(){
  var q=$('#q').value.trim().toLowerCase();
  var a=ITEMS.filter(function(i){if(fG&&i.grp!==fG)return false;
    if(q)return (i.id+' '+(i.old||'')+' '+i.name+' '+(i.brand||'')).toLowerCase().indexOf(q)>=0;return true});
  $('#crumb').innerHTML=fG?('กลุ่ม <b>'+esc(fG)+'</b> · '+a.length+' รายการ'):('ทั้งหมด <b>'+a.length+'</b> รายการ');
  $('#nid').innerHTML=fG&&a.length?('รหัสถัดไป <b>'+nextId(a[0].disc,fG)+'</b>'):'';
  $('#tb').innerHTML=a.slice(0,400).map(function(i){
    return '<tr data-id="'+i.id+'"'+(SEL===i.id?' class="sel"':'')+'>'+
    '<td><div class="tid">'+esc(i.id)+'</div>'+(i.old?'<div class="told">เดิม '+esc(i.old)+'</div>':'')+'</td>'+
    '<td>'+(i.img?'<img class="timg" loading="lazy" alt="" src="'+esc(i.img)+'" onerror="this.outerHTML=\'<div class=tno>—</div>\'">':'<div class="tno">—</div>')+'</td>'+
    '<td>'+esc(i.name.slice(0,72))+'</td><td>'+(i.grade?'<span class="tg">'+esc(i.grade)+'</span>':'')+'</td>'+
    '<td>'+esc(i.brand||'')+'</td><td style="text-align:right" class="num">'+(i.price?'<b>'+Number(i.price).toLocaleString()+'</b>':'—')+'</td>'+
    '<td>'+esc(i.unit||'')+'</td><td>'+(isStale(i.pd)?'<span class="fl f-st">⚠ ราคาเก่า</span>':'')+(i.src==='BOQ'?' <span class="fl f-bq">BOQ</span>':'')+'</td></tr>'}).join('');
  $$('#tb tr').forEach(function(r){r.onclick=function(){SEL=r.dataset.id;render();ins()}});
}
$('#q').addEventListener('input',render);
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'){$$('.ov').forEach(function(o){o.classList.remove('show')});$('#pv').classList.remove('show')}});
function byId(id){return ITEMS.filter(function(x){return x.id===id})[0]}
function ins(){var i=byId(SEL);if(!i)return;
  $('#ins').innerHTML='<div class="im">'+(i.img?'<img alt="" src="'+esc(i.img)+'" onerror="this.parentNode.textContent=\'ไม่มีรูป\'">':'ไม่มีรูป')+'</div>'+
  '<div class="did">'+esc(i.id)+'</div><div class="dfid">รหัสเต็ม BOQ: '+esc(i.fid)+(i.old?' · เดิม '+esc(i.old):'')+'</div>'+
  '<div class="dnm">'+esc(i.name)+'</div>'+
  '<div class="kv"><span>ราคา</span><b class="num">'+(i.price?Number(i.price).toLocaleString()+' ฿'+(i.unit?'/'+esc(i.unit):''):'—')+'</b></div>'+
  '<div class="kv"><span>แบรนด์</span><b>'+esc(i.brand||'—')+'</b></div>'+
  '<div class="kv"><span>เกรด</span><b>'+esc(i.grade||'—')+'</b></div>'+
  '<div class="kv"><span>ขนาด/ชนิด</span><b>'+esc(i.size||'—')+'</b></div>'+
  '<div class="kv"><span>ราคา ณ วันที่</span><b>'+esc(i.pd||'—')+(isStale(i.pd)?' <span class="fl f-st">เก่า</span>':'')+'</b></div>'+
  '<div class="kv"><span>กลุ่ม</span><b>'+esc(i.grp)+' '+esc(i.gn||'')+'</b></div>'+
  (i.qty?'<div class="kv"><span>ปริมาณ BOQ</span><b>'+esc(i.qty)+' '+esc(i.unit||'')+'</b></div>':'')+
  '<div class="ib"><button class="btn" onclick="quick(\''+i.id+'\')">→ ใส่ห้อง</button>'+
  (i.link?'<button class="btn g" onclick="window.open(\''+esc(i.link)+'\',\'_blank\')">เปิดสินค้า</button>':'')+'</div>'+
  '<div style="margin-top:12px;font-size:11px;color:var(--mut)">ใช้ในโครงการ: '+used(i.id)+'</div>';
  if(innerWidth<900)$('#ins').classList.add('mob')}
function used(id){var n=[];PRJ.forEach(function(p){(p.rooms||[]).forEach(function(r){(r.mats||[]).forEach(function(m){if(m.id===id)n.push(p.name+' ห้อง '+r.no)})})});
  return n.length?esc(n.join(', ')):'ยังไม่ถูกใช้'}
function nextId(d,g){var mx=0;ITEMS.forEach(function(i){if(i.disc===d&&i.grp===g){var m=String(i.id).match(/-(\d+)$/);if(m)mx=Math.max(mx,+m[1])}});return g+'-'+pad2(mx+1)}
$('#bAdd').onclick=function(){var ds=Object.keys(DISC);
  $('#iD').innerHTML=ds.map(function(x){return '<option value="'+x+'">'+x+' '+DISC[x][0]+'</option>'}).join('');
  var f=fG?ITEMS.filter(function(i){return i.grp===fG})[0]:null;
  $('#iD').value=f?f.disc:'FF';syncG();if(fG)$('#iG').value=fG;upId();
  ['iN','iP','iU','iB','iI'].forEach(function(x){$('#'+x).value=''});$('#iGr').value='';op('ovM')};
function syncG(){var d=$('#iD').value,gs={};ITEMS.forEach(function(i){if(i.disc===d)gs[i.grp]=i.gn||''});
  $('#iG').innerHTML=Object.keys(gs).sort().map(function(g){return '<option value="'+g+'">'+g+' '+esc(gs[g]).slice(0,22)+'</option>'}).join('')+'<option value="__n">＋ กลุ่มใหม่…</option>';upId()}
function upId(){var d=$('#iD').value,g=$('#iG').value;if(g==='__n'){$('#aidV').textContent='(ใหม่)';$('#aidF').textContent='—';return}
  var id=nextId(d,g);$('#aidV').textContent=id;$('#aidF').textContent=d+'-'+id}
$('#iD').onchange=syncG;
$('#iG').onchange=function(){if(this.value==='__n'){var g=prompt('รหัสกลุ่มใหม่:');if(g){var o=document.createElement('option');o.value=g.toUpperCase().trim();o.textContent=o.value;this.insertBefore(o,this.firstChild);this.value=o.value}else this.selectedIndex=0}upId()};
$('#mS').onclick=function(){var n=$('#iN').value.trim();if(!n){tst('กรอกรายละเอียด','err');return}
  var d=$('#iD').value,g=$('#iG').value;if(g==='__n'){tst('เลือกกลุ่ม','err');return}
  var id=nextId(d,g);
  var it={id:id,fid:d+'-'+id,old:'',disc:d,grp:g,gn:($('#iG').selectedOptions[0]||{}).textContent.replace(/^\S+\s*/,''),name:n,size:'',
    grade:$('#iGr').value,brand:$('#iB').value.trim(),link:'',price:$('#iP').value.trim(),img:$('#iI').value.trim(),unit:$('#iU').value.trim(),pd:thToday(),src:'NEW'};
  ITEMS.push(it);var a=LS('add',[]);a.push(it);SS('add',a);cl('ovM');tree();render();tst('เพิ่มแล้ว → '+id,'ok')};
$('#bExp').onclick=function(){
  var a=ITEMS.filter(function(i){return !fG||i.grp===fG});
  var rows=[['รหัสเต็ม','รหัส','รหัสเดิม','หมวด','กลุ่ม','รายละเอียด','แบรนด์','เกรด','หน่วย','ราคา/หน่วย','ปริมาณ BOQ']];
  a.forEach(function(i){rows.push([i.fid,i.id,i.old||'',i.disc,i.grp+' '+(i.gn||''),i.name,i.brand||'',i.grade||'',i.unit||'',i.price||'',i.qty||''])});
  var csv='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var el=document.createElement('a');el.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  el.download='SPEC_'+(fG||'ALL')+'.csv';el.click();tst('ส่งออก '+a.length+' รายการ','ok')};
/* projects */
function rp(){$('#prjs').innerHTML=PRJ.map(function(p){
  var n=(p.rooms||[]).reduce(function(a,r){return a+(r.mats||[]).length},0);
  return '<div class="room" style="margin-bottom:12px"><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">'+
  '<b style="font-size:14px">'+esc(p.name)+'</b><span class="fl f-bq">'+esc(p.status)+'</span>'+
  '<span style="font-size:11.5px;color:var(--mut)">'+esc((p.cover&&p.cover.no)||'')+' · '+(p.rooms||[]).length+' ห้อง · '+n+' วัสดุ</span></div>'+
  '<div class="rgrid" style="margin-top:11px">'+(p.rooms||[]).map(function(r,ri){
    return '<div class="room"><div class="rn"><span class="rno">'+esc(r.no)+'</span>'+esc(r.name)+'</div><ul>'+
    ((r.mats||[]).length?r.mats.map(function(m){var i=byId(m.id)||{};
      return '<li><b>'+esc(m.id)+'</b><span>'+esc((i.name||'').slice(0,22))+(m.qty?' ('+esc(m.qty)+')':'')+'</span></li>'}).join(''):'<li style="color:#3A4A63">— ว่าง —</li>')+
    '</ul><button class="btn g" style="width:100%;margin-top:8px;font-size:11.5px;padding:5px 0" data-pk="'+p.id+'" data-ri="'+ri+'">＋ วัสดุ</button></div>'}).join('')+'</div>'+
  '<div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap"><button class="btn g" data-fs="'+p.id+'">📋 ตารางรวม</button>'+
  '<button class="btn ok" data-bq="'+p.id+'">⬇ ส่งประมาณราคา</button><button class="btn g" data-pr="'+p.id+'">🔗 นำเสนอลูกค้า</button></div><div id="fs-'+p.id+'"></div></div>'}).join('');
  $$('#prjs [data-pk]').forEach(function(b){b.onclick=function(){pick(b.dataset.pk,+b.dataset.ri)}});
  $$('#prjs [data-fs]').forEach(function(b){b.onclick=function(){fs(b.dataset.fs)}});
  $$('#prjs [data-bq]').forEach(function(b){b.onclick=function(){boq(b.dataset.bq)}});
  $$('#prjs [data-pr]').forEach(function(b){b.onclick=function(){present(b.dataset.pr)}})}
$('#np').onclick=function(){var n=prompt('ชื่อโครงการ:');if(!n)return;
  var rs=prompt('ห้อง (เลข:ชื่อ):','101:นั่งเล่น, 102:ครัว, 201:นอนใหญ่');
  var rooms=(rs||'').split(',').map(function(s){var p=s.trim().split(':');return{no:(p[0]||'').trim(),name:(p[1]||'').trim(),mats:[]}}).filter(function(r){return r.no});
  PRJ.push({id:'P'+Date.now(),name:n,status:'ร่าง',cover:{},rooms:rooms});SS('prj',PRJ);rp();tst('สร้างแล้ว','ok')};
function pick(pid,ri){CP=PRJ.filter(function(x){return x.id===pid})[0];CR=ri;
  $('#rT').textContent='เลือกวัสดุ → ห้อง '+CP.rooms[ri].no;$('#rq').value='';$('#rn').value='';$('#rqt').value='';rsr();op('ovR')}
function quick(id){if(!PRJ.length)return;CP=PRJ[0];CR=0;$('#rT').textContent='เลือกวัสดุ → '+CP.name;$('#rq').value=id;rsr();op('ovR')}
function rsr(){var q=$('#rq').value.trim().toLowerCase();
  var a=q?ITEMS.filter(function(i){return (i.id+' '+(i.old||'')+' '+i.name).toLowerCase().indexOf(q)>=0}).slice(0,40):[];
  $('#rr').innerHTML=!q?'<p style="padding:12px;color:var(--mut);font-size:12px">พิมพ์เพื่อค้นหา…</p>':
    (a.length?a.map(function(i){return '<div style="display:flex;gap:8px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line);font-size:12px">'+
    '<span class="tid" style="width:74px">'+esc(i.id)+'</span><span style="flex:1">'+esc(i.name.slice(0,40))+'</span>'+
    '<button class="btn" style="padding:3px 9px;font-size:11.5px" data-a="'+i.id+'">เพิ่ม</button></div>'}).join(''):'<p style="padding:12px;color:var(--mut);font-size:12px">ไม่พบ</p>');
  $$('#rr [data-a]').forEach(function(b){b.onclick=function(){am(b.dataset.a)}})}
$('#rq').addEventListener('input',rsr);
function am(id){var r=CP.rooms[CR];r.mats=r.mats||[];
  if(r.mats.some(function(m){return m.id===id})){tst('มีแล้ว','err');return}
  r.mats.push({id:id,note:$('#rn').value.trim(),qty:$('#rqt').value.trim()});SS('prj',PRJ);rp();tst('เพิ่ม '+id+' → ห้อง '+r.no,'ok')}
function fs(pid){var p=PRJ.filter(function(x){return x.id===pid})[0],b=$('#fs-'+pid);
  if(b.innerHTML){b.innerHTML='';return}
  var g={};(p.rooms||[]).forEach(function(r){(r.mats||[]).forEach(function(m){var i=byId(m.id)||{};var k=i.gn||i.grp||'อื่นๆ';g[k]=g[k]||{};(g[k][r.no]=g[k][r.no]||[]).push(m.id)})});
  var ks=Object.keys(g).sort();
  b.innerHTML=ks.length?'<div style="overflow-x:auto"><table class="fs"><thead><tr><th>ประเภทงาน</th>'+(p.rooms||[]).map(function(r){return '<th>'+esc(r.no)+'<br><span style="font-weight:400">'+esc(r.name)+'</span></th>'}).join('')+'</tr></thead><tbody>'+
    ks.map(function(k){return '<tr><td><b>'+esc(k)+'</b></td>'+(p.rooms||[]).map(function(r){var v=g[k][r.no];return v?'<td>'+v.map(esc).join(', ')+'</td>':'<td class="e">—</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'
    :'<p style="color:var(--mut);font-size:11.5px;margin-top:8px">ยังไม่มีวัสดุ</p>'}
function boq(pid){var p=PRJ.filter(function(x){return x.id===pid})[0];
  var rows=[['รหัสเต็ม','รหัส','รายละเอียด','แบรนด์','เกรด','หน่วย','ราคา/หน่วย','ห้อง','ตำแหน่ง','จำนวน','รวม']],t=0;
  (p.rooms||[]).forEach(function(r){(r.mats||[]).forEach(function(m){var i=byId(m.id)||{};
    var q=parseFloat(m.qty)||0,pr=parseFloat(i.price)||0,s=q*pr;t+=s;
    rows.push([i.fid||'',i.id||m.id,i.name||'',i.brand||'',i.grade||'',i.unit||'',pr||'',r.no,m.note||'',m.qty||'',s||''])})});
  if(rows.length<2){tst('ยังไม่มีวัสดุ','err');return}
  rows.push(['','','','','','','','','','รวม',t]);
  var csv='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='BOQ_'+p.name.replace(/[^\wก-๙\-]/g,'_')+'.csv';a.click();tst('ส่งออกแล้ว','ok')}
function present(pid){var p=PRJ.filter(function(x){return x.id===pid})[0];
  $('#pvb').innerHTML='<div class="pcov"><h1>'+esc(p.name)+'</h1><p>'+esc((p.cover&&p.cover.site)||'')+((p.cover&&p.cover.no)?' · แบบเลขที่ '+esc(p.cover.no):'')+'</p>'+
    '<p style="margin-top:10px;font-size:12px;opacity:.72">รายการวัสดุประกอบแบบ · MA.FC GROUP</p></div><div class="pw">'+
    (p.rooms||[]).map(function(r){return '<div class="prm"><h2><span class="no">'+esc(r.no)+'</span>'+esc(r.name)+'</h2><div class="pms">'+
      ((r.mats||[]).length?r.mats.map(function(m){var i=byId(m.id)||{};
        return '<div class="pm"><div class="pi">'+(i.img?'<img alt="" src="'+esc(i.img)+'" onerror="this.parentNode.textContent=\'\'">':'')+'</div>'+
        '<div class="pb"><div class="pk">'+esc(i.brand||'')+(i.grade?' · เกรด '+esc(i.grade):'')+'</div><div class="pn">'+esc(i.name||m.id)+'</div>'+
        (m.note?'<div class="pk" style="margin-top:3px">'+esc(m.note)+'</div>':'')+'</div></div>'}).join(''):'<p style="color:#94a3b8;font-size:13px">— ยังไม่ระบุ —</p>')+
      '</div></div>'}).join('')+'<p style="text-align:center;color:#94a3b8;font-size:12px;padding:14px">ไม่แสดงราคาต้นทุน · ลิงก์ปิดได้ทุกเมื่อ</p></div>';
  $('#pv').classList.add('show')}
function cp(){$('#pv').classList.remove('show')}
function rqa(){
  var noP=[],stale=[],odd=[],noU=[];
  ITEMS.forEach(function(i){if(!i.price)noP.push(i);if(isStale(i.pd))stale.push(i);
    if(i.old&&!/^[A-Z]{1,3}\d{1,2}-\d{1,2}$/.test(i.old))odd.push(i);if(i.price&&!i.unit)noU.push(i)});
  function b(t,l,c){return '<div class="room" style="margin-bottom:11px"><b style="font-size:13.5px">'+t+'</b> '+
    '<span class="fl" style="background:'+c+'22;color:'+c+'">'+l.length+' รายการ</span>'+
    '<div style="font-size:11px;color:var(--mut);margin-top:7px;line-height:1.65">'+l.slice(0,10).map(function(i){return esc(i.id)+' '+esc((i.name||'').slice(0,38))}).join('<br>')+
    (l.length>10?'<br>… อีก '+(l.length-10):'')+'</div></div>'}
  $('#qa').innerHTML='<b style="font-size:14.5px">ตรวจสอบคุณภาพข้อมูล (อัตโนมัติ)</b><div style="height:11px"></div>'+
    b('⚠ ราคาเก่ากว่า 90 วัน',stale,'#FBBF24')+b('💰 ยังไม่มีราคา',noP,'#F87171')+
    b('📏 มีราคาแต่ไม่มีหน่วย (เสี่ยงคิด BOQ ผิด)',noU,'#F87171')+
    b('🔤 รหัสเดิมผิดแบบแผน — ระบบออกรหัสใหม่ให้แล้ว',odd,'#7DD3FC')}
$$('.tabs button').forEach(function(b){b.onclick=function(){$$('.tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
  $('#v-lib').classList.toggle('hide',b.dataset.v!=='lib');
  $('#v-prj').classList.toggle('hide',b.dataset.v!=='prj');
  $('#v-qa').classList.toggle('hide',b.dataset.v!=='qa')}});
load();
</script>
